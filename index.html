<header><h1>Consulta Placas Mercosul</h1><p>Consulta pelas três primeiras letras</p></header>
<main>
<section class="card">
<label for="search">Digite as 3 letras da placa</label>
<input id="search" maxlength="3" autocomplete="off" autocapitalize="characters" placeholder="Ex.: NRF" inputmode="text">
<div id="error" class="error">Sequência não encontrada na base.</div>
<div id="result" class="result">
<div class="seq" id="seq"></div>
<div class="uf" id="uf"></div>
<div class="state" id="state"></div>
<div class="badge">UF da série atribuída</div>
</div>
<div class="controls">
<button onclick="clearSearch()">Limpar</button>
<button class="secondary" onclick="shareResult()">Compartilhar</button>
</div>
</section>

<section class="card">
<label for="ufSelect">Ou selecione um estado</label>
<select id="ufSelect"><option value="">Todos os estados</option></select>
<div style="height:12px"></div>
<input id="filter" maxlength="3" placeholder="Filtrar séries..." inputmode="text" style="font-size:16px">
<div style="height:12px"></div>
<div class="small"><span id="count" class="count">0</span> combinações encontradas</div>
<div style="overflow:auto;margin-top:8px;max-height:430px">
<table><thead><tr><th>Sequência</th><th>UF</th><th>Estado</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</section>
<section class="card small">
<strong>Base:</strong> 13.863 combinações de três letras distribuídas às 27 UFs. O app funciona localmente após os arquivos serem instalados/abertos.
</section>
</main>
